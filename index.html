<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shadow AI 🖤</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: black;
  color: #00ff9d;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 15px;
  text-align: center;
  font-size: 22px;
  border-bottom: 1px solid #00ff9d;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  margin: 10px;
  padding: 10px;
  border-radius: 5px;
  max-width: 80%;
}

.user {
  background: #00ff9d;
  color: black;
  margin-left: auto;
}

.bot {
  background: #111;
  position: relative;
}

#inputBox {
  display: flex;
  border-top: 1px solid #00ff9d;
}

input {
  flex: 1;
  padding: 15px;
  border: none;
  outline: none;
  background: black;
  color: #00ff9d;
}

button {
  padding: 15px;
  background: #00ff9d;
  border: none;
  cursor: pointer;
}

/* Cursor blink */
@keyframes blink {
  0% {opacity: 1;}
  50% {opacity: 0;}
  100% {opacity: 1;}
}

.bot::after {
  content: "|";
  animation: blink 1s infinite;
}
</style>
</head>

<body>

<header>🖤 SHADOW AI TERMINAL</header>

<div id="chat"></div>

<div id="inputBox">
  <input id="msg" placeholder="Type command...">
  <button onclick="send()">ENTER</button>
</div>

<!-- 🔊 Typing Sound -->
<audio id="typeSound" src="https://www.soundjay.com/mechanical/keyboard-1.mp3"></audio>

<script>
7
const API_KEY = "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";

function addMsg(text, cls){
  let div = document.createElement("div");
  div.className = "msg " + cls;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 9999;
  return div;
}

// 🔥 Typing + Sound Effect
function typeEffect(element, text, speed=20){
  let i = 0;
  element.innerText = "";
  let sound = document.getElementById("typeSound");

  function typing(){
    if(i < text.length){
      element.innerText += text.charAt(i);
      
      // 🔊 play sound
      sound.currentTime = 0;
      sound.play();

      i++;
      setTimeout(typing, speed);
    }
  }

  typing();
}

async function send(){
  let input = document.getElementById("msg");
  let text = input.value.trim();
  if(!text) return;

  addMsg(text, "user");
  input.value = "";

  let botDiv = addMsg("", "bot");

  let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: "llama3-70b-8192",
      messages: [
        { role: "system", content: "You are Shadow AI, hacker style, dark, smart and slightly savage assistant." },
        { role: "user", content: text }
      ]
    })
  });

  let data = await res.json();
  let reply = data.choices[0].message.content;

  typeEffect(botDiv, reply, 15);
}

</script>

</body>
</html>
